services:
  - type: web
    name: signal-emergency-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # To attach a persistent PostgreSQL database, uncomment the database below
      # and replace DATABASE_URL with:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: signal-emergency-db
      #     property: connectionString

# Optional persistent managed PostgreSQL database on Render:
# databases:
#   - name: signal-emergency-db
#     databaseName: signal_emergency
#     user: signal_admin
#     plan: free
